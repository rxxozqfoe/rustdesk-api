name: CI

# Runs on every PR to master and every push to master. Delegates the
# actual validation to the reusable _validate.yml workflow, so the
# identical validation pipeline is used by publish.yml before publishing
# an image.
#
# This workflow does NOT build or push an image. The image publish
# pipeline lives in .github/workflows/publish.yml and triggers only on
# v*.*.* tags.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Collapse redundant runs on the same ref. On a PR, a new push cancels
# the previous still-running validation (cancel-in-progress). On a push
# to master we do NOT cancel — every commit that lands on the default
# branch keeps its own complete CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
    permissions:
      contents: read
      security-events: write   # for the scan job to upload SARIF
      pull-requests: write     # for dependency-review to comment on PRs
